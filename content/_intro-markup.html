<div class="rh-intro" id="rh-intro" hidden role="dialog" aria-modal="true" aria-label="Site introduction">
  <canvas class="rh-intro__warp" aria-hidden="true"></canvas>
  <div class="rh-intro__vignette" aria-hidden="true"></div>
  <div class="rh-intro__scan" aria-hidden="true"></div>
  <div class="rh-intro__grain" aria-hidden="true"></div>
  <div class="rh-intro__flare" aria-hidden="true"></div>
  <div class="rh-intro__flash" aria-hidden="true"></div>

  <div class="rh-intro__stage" aria-hidden="true">

    <p class="rh-beat rh-beat--boot" data-beat="boot"><span class="rh-boot__line"></span><i class="rh-caret"></i></p>

    <h2 class="rh-beat rh-beat--name" data-beat="name" data-text="ROMAN HEUSER">ROMAN HEUSER</h2>

    <div class="rh-beat rh-beat--card" data-beat="c1">
      <p class="rh-card__lead">Three products.<br><b>All of them live.</b></p>
      <div class="rh-card__rule"></div>
      <p class="rh-card__sub">Not pitched &middot; not planned &middot; shipped</p>
    </div>

    <div class="rh-beat rh-beat--card" data-beat="c2">
      <p class="rh-card__lead">A <b>$3.5M</b> company<br>handed me the frontend.</p>
      <div class="rh-card__rule"></div>
      <p class="rh-card__sub">Full authority over the redesign</p>
    </div>

    <div class="rh-beat rh-beat--card" data-beat="c3">
      <p class="rh-card__lead">Seven agents.<br><b>Six seconds.</b></p>
      <div class="rh-card__rule"></div>
      <p class="rh-card__sub">One perfect night in Las Vegas</p>
    </div>

    <div class="rh-beat rh-beat--sign" data-beat="sign">
      <img src="__LOGO__" alt="">
      <p class="rh-sign__tag">Las Vegas &rarr; Reno &middot; 2026</p>
    </div>

  </div>

  <div class="rh-intro__prog" aria-hidden="true"><i></i></div>
  <button class="rh-intro__skip" type="button">Skip</button>
</div>
<template id="rh-intro-template"></template>
