<div class="rhxg" id="rhxg-root">
	<button class="rhxg__launch" type="button" aria-expanded="false" aria-controls="rhxg-panel">
		<span class="rhxg__launch-icon" aria-hidden="true">
			<svg viewBox="0 0 24 24"><path d="M4 3h9l7 7v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M13 3v7h7" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M8 13.5l3.2 4.5M11.2 13.5L8 18" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
		</span>
		<span class="rhxg__launch-label">Ask about Excel</span>
	</button>

	<div class="rhxg__panel" id="rhxg-panel" role="dialog" aria-label="Excel Helper" hidden>
		<div class="rhxg__head">
			<div>
				<p class="rhxg__kicker">Microsoft Excel</p>
				<h3 class="rhxg__title">Excel Helper</h3>
			</div>
			<div class="rhxg__tools">
				<button class="rhxg__reset" type="button">Start over</button>
				<button class="rhxg__close" type="button" aria-label="Close">&times;</button>
			</div>
		</div>

		<div class="rhxg__log" role="log" aria-live="polite" aria-label="Excel Helper conversation" tabindex="0"></div>
		<div class="rhxg__chips" role="group" aria-label="Suggested questions"></div>

		<form class="rhxg__form" autocomplete="off">
			<label class="rhxg__sr" for="rhxg-input">Ask an Excel question or paste a formula</label>
			<textarea id="rhxg-input" class="rhxg__input" rows="1" maxlength="1200" spellcheck="false" placeholder="Ask, or paste a formula"></textarea>
			<button class="rhxg__send" type="submit" aria-label="Send">
				<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 20.5L21 12 3.5 3.5 3.5 10l12 2-12 2z" fill="currentColor"/></svg>
			</button>
		</form>

		<p class="rhxg__foot" hidden><a href="#" target="_blank" rel="noopener noreferrer">Open my Excel GPT ↗</a></p>
	</div>
</div>
